<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head('用户管理')}"></head>
<body class="admin-body">

<aside th:replace="~{fragments/admin :: sidebar('user')}"></aside>

<div class="admin-main">
    <div th:replace="~{fragments/admin :: topbar('用户管理')}"></div>

    <div class="admin-content">

        <div class="breadcrumb">
            <a href="/admin/index">工作台</a> / <span>用户管理</span>
        </div>

        <div class="toolbar">
            <form class="toolbar-filters" action="/admin/user/list" method="get">
                <input type="text" name="keyword" class="form-control"
                       th:value="${query.keyword}" placeholder="账号 / 姓名 / 手机号">
                <select name="roleCode" class="form-control">
                    <option value="">全部角色</option>
                    <option th:each="r : ${roles}" th:value="${r.roleCode}"
                            th:text="${r.roleName}"
                            th:selected="${query.roleCode != null and query.roleCode == r.roleCode}">角色</option>
                </select>
                <select name="status" class="form-control">
                    <option value="">全部状态</option>
                    <option value="1" th:selected="${query.status != null and query.status == 1}">正常</option>
                    <option value="0" th:selected="${query.status != null and query.status == 0}">已禁用</option>
                </select>
                <button type="submit" class="btn">查询</button>
                <a href="/admin/user/list" class="btn btn-outline">重置</a>
            </form>
            <a href="/admin/user/edit" class="btn btn-accent">+ 新增用户</a>
        </div>

        <div class="card">
            <div class="table-wrap">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th style="width:60px">ID</th>
                        <th>账号 / 姓名</th>
                        <th style="width:100px">角色</th>
                        <th style="width:130px">手机号</th>
                        <th style="width:110px">账户余额</th>
                        <th style="width:110px">注册时间</th>
                        <th style="width:90px">状态</th>
                        <th style="width:220px">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${page.list}">
                        <td th:text="${u.id}">1</td>
                        <td>
                            <div style="display:flex;align-items:center;gap:10px">
                                <span class="nav-avatar" style="width:32px;height:32px;font-size:13px"
                                      th:text="${#strings.substring(u.realName, 0, 1)}">用</span>
                                <div>
                                    <div style="font-weight:600" th:text="${u.realName}">姓名</div>
                                    <div style="color:#9ca3af;font-size:12px"
                                         th:text="'@' + ${u.username}">账号</div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${u.admin} ? 'red' : (${u.host} ? 'orange' : 'blue')"
                                  th:text="${u.roleText}">角色</span>
                        </td>
                        <td th:text="${u.phone}">手机</td>
                        <td style="color:#dc2626;font-weight:600" th:text="'¥' + ${u.balance}">¥0</td>
                        <td style="font-size:13px;color:#6b7280"
                            th:text="${#temporals.format(u.creationDate, 'yyyy-MM-dd')}">时间</td>
                        <td>
                            <span class="badge" th:classappend="${u.status == 1} ? 'green' : 'gray'"
                                  th:text="${u.statusText}">状态</span>
                        </td>
                        <td>
                            <div class="table-actions">
                                <a th:href="@{/admin/user/edit/{id}(id=${u.id})}"
                                   class="btn btn-sm btn-outline">编辑</a>

                                <button th:if="${!u.admin}" type="button" class="btn btn-sm btn-outline"
                                        data-url="/admin/user/status"
                                        th:data-id="${u.id}" th:data-status="${u.status == 1 ? 0 : 1}" 
                                        th:data-confirm="${u.status == 1}
                                            ? '禁用后该账号将无法登录，确定禁用吗？' : '确定启用该账号吗？'"
                                        th:text="${u.status == 1} ? '禁用' : '启用'">禁用</button>

                                <button th:if="${!u.admin}" type="button" class="btn btn-sm btn-outline"
                                        data-url="/admin/user/reset"
                                        th:data-id="${u.id}" 
                                        data-confirm="确定将该用户的密码重置为 123456 吗？">重置密码</button>

                                <button th:if="${!u.admin}" type="button" class="btn btn-sm btn-outline"
                                        style="border-color:#dc2626;color:#dc2626"
                                        data-url="/admin/user/delete"
                                        th:data-id="${u.id}" 
                                        data-confirm="删除后该用户的账号信息将不可恢复，确定删除吗？"
                                        data-confirm-text="确定删除">删除</button>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="empty" th:if="${page.list.size() == 0}">
                <div class="empty-icon">👥</div>
                <div class="empty-text">没有找到符合条件的用户</div>
            </div>
        </div>

        <div th:replace="~{fragments/admin :: pagination(${page})}"></div>
    </div>
</div>

<div id="toast"></div>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/admin.js}"></script>

</body>
</html>
