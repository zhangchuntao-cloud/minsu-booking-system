<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head('编辑用户')}"></head>
<body class="admin-body">

<aside th:replace="~{fragments/admin :: sidebar('user')}"></aside>

<div class="admin-main">
    <div th:replace="~{fragments/admin :: topbar('编辑用户')}"></div>

    <div class="admin-content">

        <div class="breadcrumb">
            <a href="/admin/index">工作台</a> /
            <a href="/admin/user/list">用户管理</a> /
            <span th:text="${user.id == null} ? '新增用户' : '编辑用户'">编辑用户</span>
        </div>

        <div class="alert alert-error" th:if="${error != null}">
            <span th:text="${error}">错误信息</span>
        </div>
        <div class="alert alert-info" th:if="${user.id == null}">
            新增用户的初始密码为 <b>123456</b>，可在列表中重置
        </div>

        <form action="/admin/user/save" method="post" style="max-width:760px">
            <input type="hidden" name="id" th:value="${user.id}">

            <div class="form-section">
                <div class="form-section-title">账号信息</div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">登录账号<span class="required">*</span></label>
                        <input type="text" name="username" class="form-control"
                               th:value="${user.username}"
                               th:readonly="${user.id != null}"
                               placeholder="字母开头，4-20 位"
                               data-rule="required" data-label="登录账号">
                        <div class="form-hint" th:if="${user.id != null}">登录账号创建后不可修改</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">真实姓名<span class="required">*</span></label>
                        <input type="text" name="realName" class="form-control"
                               th:value="${user.realName}"
                               data-rule="required" data-label="真实姓名">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">手机号码<span class="required">*</span></label>
                        <input type="text" name="phone" class="form-control"
                               th:value="${user.phone}"
                               data-rule="required|phone" data-label="手机号码">
                    </div>
                    <div class="form-group">
                        <label class="form-label">电子邮箱</label>
                        <input type="text" name="email" class="form-control"
                               th:value="${user.email}"
                               data-rule="email" data-label="电子邮箱">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">性别</label>
                        <select name="gender" class="form-control">
                            <option value="1" th:selected="${user.gender == null or user.gender == '1'}">男</option>
                            <option value="2" th:selected="${user.gender == '2'}">女</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">用户角色<span class="required">*</span></label>
                        <select name="roleCode" class="form-control"
                                data-rule="required" data-label="用户角色">
                            <option th:each="r : ${roles}" th:value="${r.roleCode}"
                                    th:text="${r.roleName}"
                                    th:selected="${user.roleCode != null and user.roleCode == r.roleCode}">角色</option>
                        </select>
                        <div class="form-hint">管理员账号的角色不允许被修改</div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">出生日期</label>
                        <input type="date" name="birthday" class="form-control" th:value="${user.birthday}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">身份证号</label>
                        <input type="text" name="idCard" class="form-control" th:value="${user.idCard}">
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-lg"
                        th:text="${user.id == null} ? '新增用户' : '保存修改'">保存</button>
                <a href="/admin/user/list" class="btn btn-lg btn-outline">取消</a>
            </div>
        </form>

    </div>
</div>

<div id="toast"></div>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/admin.js}"></script>
<script>
    document.querySelector('form[action="/admin/user/save"]').addEventListener('submit', function (e) {
        if (!Minsu.validateForm(this)) {
            e.preventDefault();
        }
    });
</script>

</body>
</html>
