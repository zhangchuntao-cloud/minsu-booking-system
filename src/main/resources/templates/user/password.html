<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('修改密码')}"></head>
<body>

<header th:replace="~{fragments/common :: header('')}"></header>

<main class="page-main">
    <div class="container">
        <div class="breadcrumb" style="margin-bottom:18px">
            <a href="/index">首页</a> / <a href="/user/center">个人中心</a> / <span>修改密码</span>
        </div>

        <div class="center-layout">
            <div th:replace="~{fragments/center :: menu('password')}"></div>

            <div class="card" style="max-width:560px">
                <div class="card-header">
                    <div class="card-title">修改登录密码</div>
                </div>
                <div class="card-body">
                    <div class="alert alert-info">
                        为保障账号安全，修改密码后需要重新登录
                    </div>

                    <form id="passwordForm" onsubmit="return false">
                        <div class="form-group">
                            <label class="form-label">当前密码<span class="required">*</span></label>
                            <input type="password" id="oldPassword" class="form-control"
                                   placeholder="请输入当前使用的密码"
                                   data-rule="required" data-label="当前密码">
                        </div>
                        <div class="form-group">
                            <label class="form-label">新密码<span class="required">*</span></label>
                            <input type="password" id="newPassword" class="form-control"
                                   placeholder="6-20 位字符"
                                   data-rule="required|password" data-label="新密码">
                        </div>
                        <div class="form-group">
                            <label class="form-label">确认新密码<span class="required">*</span></label>
                            <input type="password" id="confirmPassword" class="form-control"
                                   placeholder="请再次输入新密码"
                                   data-rule="required" data-label="确认新密码">
                        </div>

                        <div class="form-actions">
                            <button type="button" id="submitBtn" class="btn">确认修改</button>
                            <a href="/user/center" class="btn btn-outline">返回</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>

<div id="toast"></div>
<script th:src="@{/js/common.js}"></script>
<script>
    document.getElementById('submitBtn').addEventListener('click', function () {
        var form = document.getElementById('passwordForm');
        if (!Minsu.validateForm(form)) {
            return;
        }
        var newPassword = document.getElementById('newPassword').value;
        var confirmPassword = document.getElementById('confirmPassword').value;
        if (newPassword !== confirmPassword) {
            Minsu.toast('两次输入的新密码不一致', 'error');
            return;
        }

        var btn = this;
        btn.disabled = true;
        Minsu.post('/user/password/save', {
            oldPassword: document.getElementById('oldPassword').value,
            newPassword: newPassword,
            confirmPassword: confirmPassword
        }).then(function (result) {
            Minsu.toast(result.msg, 'success');
            setTimeout(function () {
                window.location.href = '/login';
            }, 1200);
        }).catch(function () {
            btn.disabled = false;
        });
    });
</script>

</body>
</html>
