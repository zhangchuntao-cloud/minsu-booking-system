<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('注册')}"></head>
<body>

<header th:replace="~{fragments/common :: header('')}"></header>

<div class="auth-page">
    <div class="auth-card" style="max-width:480px">
        <h1 class="auth-title">创建账号</h1>
        <p class="auth-subtitle">注册即可领取 100 元新人礼包</p>

        <div class="alert alert-error" th:if="${error != null}">
            <span th:text="${error}">错误信息</span>
        </div>

        <form action="/register" method="post" id="registerForm">
            <div class="form-group">
                <label class="form-label">登录账号<span class="required">*</span></label>
                <input type="text" name="username" class="form-control" id="username"
                       th:value="${form.username}" placeholder="字母开头，4-20 位字母数字下划线"
                       data-rule="required|username" data-label="登录账号">
                <div class="form-hint" id="usernameHint"></div>
            </div>

            <div class="form-row" style="grid-template-columns:1fr 1fr;gap:0 14px">
                <div class="form-group">
                    <label class="form-label">登录密码<span class="required">*</span></label>
                    <input type="password" name="password" class="form-control"
                           placeholder="6-20 位"
                           data-rule="required|password" data-label="登录密码">
                </div>
                <div class="form-group">
                    <label class="form-label">确认密码<span class="required">*</span></label>
                    <input type="password" name="confirmPassword" class="form-control"
                           placeholder="再次输入密码"
                           data-rule="required" data-label="确认密码">
                </div>
            </div>

            <div class="form-row" style="grid-template-columns:1fr 1fr;gap:0 14px">
                <div class="form-group">
                    <label class="form-label">真实姓名<span class="required">*</span></label>
                    <input type="text" name="realName" class="form-control"
                           th:value="${form.realName}" placeholder="请输入真实姓名"
                           data-rule="required" data-label="真实姓名">
                </div>
                <div class="form-group">
                    <label class="form-label">性别</label>
                    <select name="gender" class="form-control">
                        <option value="1">男</option>
                        <option value="2">女</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">手机号码<span class="required">*</span></label>
                <input type="text" name="phone" class="form-control"
                       th:value="${form.phone}" placeholder="用于接收订单通知"
                       data-rule="required|phone" data-label="手机号码">
            </div>

            <div class="form-group">
                <label class="form-label">电子邮箱</label>
                <input type="text" name="email" class="form-control"
                       th:value="${form.email}" placeholder="选填"
                       data-rule="email" data-label="电子邮箱">
            </div>

            <div class="form-group">
                <label class="form-label">注册身份<span class="required">*</span></label>
                <select name="roleCode" class="form-control">
                    <option value="USER">普通会员 — 预订房源</option>
                    <option value="HOST">房东 — 发布房源</option>
                </select>
                <div class="form-hint">房东身份需要管理员审核房源后才对外展示</div>
            </div>

            <button type="submit" class="btn btn-lg btn-block">注 册</button>
        </form>

        <div class="auth-footer">
            已有账号？<a href="/login">直接登录</a>
        </div>
    </div>
</div>

<div id="toast"></div>
<script th:src="@{/js/common.js}"></script>
<script>
    /* 账号输入框失焦时异步校验是否已被注册 */
    var usernameInput = document.getElementById('username');
    var hint = document.getElementById('usernameHint');
    usernameInput.addEventListener('blur', function () {
        var value = usernameInput.value.trim();
        if (!value) {
            hint.textContent = '';
            return;
        }
        Minsu.get('/api/user/check-username', {username: value}, {silent: true})
            .then(function (result) {
                hint.textContent = result.msg;
                hint.style.color = result.data.exists ? '#dc2626' : '#16a34a';
            })
            .catch(function () {
                hint.textContent = '';
            });
    });

    /* 提交前校验两次密码是否一致 */
    document.getElementById('registerForm').addEventListener('submit', function (e) {
        if (!Minsu.validateForm(this)) {
            e.preventDefault();
            return;
        }
        var pwd = this.querySelector('[name="password"]').value;
        var confirm = this.querySelector('[name="confirmPassword"]').value;
        if (pwd !== confirm) {
            e.preventDefault();
            Minsu.toast('两次输入的密码不一致', 'error');
        }
    });
</script>

</body>
</html>
