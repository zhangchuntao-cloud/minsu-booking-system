<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('个人资料')}"></head>
<body>

<header th:replace="~{fragments/common :: header('')}"></header>

<main class="page-main">
    <div class="container">
        <div class="breadcrumb" style="margin-bottom:18px">
            <a href="/index">首页</a> / <a href="/user/center">个人中心</a> / <span>个人资料</span>
        </div>

        <div class="center-layout">
            <div th:replace="~{fragments/center :: menu('profile')}"></div>

            <div class="card">
                <div class="card-header">
                    <div class="card-title">个人资料</div>
                </div>
                <div class="card-body">
                    <div class="alert alert-success" th:if="${success != null}">
                        <span th:text="${success}">成功</span>
                    </div>
                    <div class="alert alert-error" th:if="${error != null}">
                        <span th:text="${error}">错误</span>
                    </div>

                    <form action="/user/profile/save" method="post" id="profileForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">登录账号</label>
                                <input type="text" class="form-control" th:value="${user.username}" disabled>
                                <div class="form-hint">登录账号创建后不可修改</div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">账号角色</label>
                                <input type="text" class="form-control" th:value="${user.roleText}" disabled>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">真实姓名<span class="required">*</span></label>
                                <input type="text" name="realName" class="form-control"
                                       th:value="${user.realName}"
                                       data-rule="required" data-label="真实姓名">
                            </div>
                            <div class="form-group">
                                <label class="form-label">性别</label>
                                <select name="gender" class="form-control">
                                    <option value="1" th:selected="${user.gender == '1'}">男</option>
                                    <option value="2" th:selected="${user.gender == '2'}">女</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">手机号码<span class="required">*</span></label>
                                <input type="text" name="phone" class="form-control"
                                       th:value="${user.phone}"
                                       data-rule="required|phone" data-label="手机号码">
                            </div>
                            <div class="form-group">
                                <label class="form-label">电子邮箱</label>
                                <input type="text" name="email" class="form-control"
                                       th:value="${user.email}"
                                       data-rule="email" data-label="电子邮箱">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">出生日期</label>
                                <input type="date" name="birthday" class="form-control"
                                       th:value="${user.birthday}">
                            </div>
                            <div class="form-group">
                                <label class="form-label">身份证号</label>
                                <input type="text" name="idCard" class="form-control"
                                       th:value="${user.idCard}" placeholder="入住登记时使用">
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn">保存修改</button>
                            <a href="/user/center" class="btn btn-outline">返回</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>

<div id="toast"></div>
<script th:src="@{/js/common.js}"></script>
<script>
    document.getElementById('profileForm').addEventListener('submit', function (e) {
        if (!Minsu.validateForm(this)) {
            e.preventDefault();
        }
    });
</script>

</body>
</html>
