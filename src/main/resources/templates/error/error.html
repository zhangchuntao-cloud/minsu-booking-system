<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('操作提示')}"></head>
<body>

<header th:replace="~{fragments/common :: header('')}"></header>

<main class="page-main">
    <div class="container" style="max-width:620px">
        <div class="card">
            <div class="card-body" style="text-align:center;padding:52px 36px">
                <div style="font-size:56px;line-height:1;margin-bottom:18px">⚠️</div>
                <h1 style="font-size:22px;margin-bottom:12px">操作未能完成</h1>
                <p style="color:#6b7280;line-height:1.9;margin-bottom:26px" th:text="${message}">
                    错误信息
                </p>
                <div style="display:flex;gap:12px;justify-content:center">
                    <a th:href="${backUrl != null} ? ${backUrl} : '/index'" class="btn">返回上一页</a>
                    <a href="/index" class="btn btn-outline">回到首页</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>

<div id="toast"></div>
<script th:src="@{/js/common.js}"></script>

</body>
</html>
