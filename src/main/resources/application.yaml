server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: web_homework
  # ==================== 数据源配置 ====================
  # 说明：本项目使用独立的 MySQL 实例（端口 3307），以免与本机已有实例冲突。
  #      若改用本机默认的 3306 实例，只需修改下面的 url 端口并保证库与账号已创建。
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/minsu_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: minsu
    password: minsu123
    hikari:
      # 连接池优化：最小/最大连接数、超时时间
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      pool-name: MinsuHikariPool
  # ==================== Thymeleaf 视图配置 ====================
  thymeleaf:
    cache: false
    encoding: UTF-8
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html
  # ==================== 静态资源 ====================
  web:
    resources:
      static-locations: classpath:/static/
  # ==================== 文件上传限制 ====================
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

# ==================== MyBatis 配置 ====================
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.code.web_homework.entity
  configuration:
    # 开启下划线到驼峰的自动映射
    map-underscore-to-camel-case: true
    # 打印 SQL，便于开发调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 延迟加载
    lazy-loading-enabled: true
    aggressive-lazy-loading: false

# ==================== 业务自定义配置 ====================
minsu:
  # 上传文件保存的物理路径
  upload-path: ${user.home}/minsu-upload/
  # 上传文件的访问前缀
  upload-url-prefix: /upload/
  # 首页每页展示的房源数量
  page-size: 6

logging:
  level:
    root: info
    com.code.web_homework: debug
